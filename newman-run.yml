name: Run Newman Tests for Massage Reservation API

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'   # หรือเวอร์ชันที่ใช้อยู่

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman Collection - Massage Reservation API
        run: |
          newman run "collections/Massage Reservation API - Functional Test.postman_collection.json" \
          --reporters cli,html \
          --reporter-html-export newman-report.html

      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: massage-api-newman-report
          path: newman-report.html
