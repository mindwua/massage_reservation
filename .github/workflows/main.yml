name: Run Newman Tests for Massage Reservation API

on:
  push:
    branches: [ main ]

jobs:
  run-newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: npm install

      - name: Install Newman
        run: npm install -g newman

      - name: Install Newman HTML Extra Reporter
        run: npm install -g newman-reporter-htmlextra

      - name: Start backend
        run: npm run start &
        env:
          PORT: 3001

      - name: Wait for backend to be ready
        run: sleep 10

      - name: Run Newman Collection - Massage Reservation API
        run: |
          newman run "collections/Massage Reservation API - Functional Test.postman_collection.json" \
          --reporters cli,htmlextra \
          --reporter-htmlextra-export newman-report.html

      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: massage-api-newman-report
          path: newman-report.html
