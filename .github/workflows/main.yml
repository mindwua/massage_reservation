name: Run Newman Tests for Massage Reservation API

on:
  push:
    branches: [ main ]   # ✅ หรือจะเป็น pull_request: branches: [main] ถ้าจะรันหลัง merge

jobs:
  run-newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install backend dependencies
        run: npm install

      - name: Install Newman
        run: npm install -g newman

      - name: Install Newman HTML Reporter
        run: npm install -g newman-reporter-html

      - name: Install Newman CLI Full Reporter
        run: npm install -g newman-reporter-cli-full

      - name: Start backend
        run: npm run start &
        env:
          PORT: 3001  # กำหนด PORT ให้ตรงกับที่ Newman ยิง (แล้วแต่โปรเจกต์ของ Mai)

      - name: Wait for backend to be ready
        run: sleep 10

      - name: Run Newman Collection - Massage Reservation API
        run: |
          newman run "collections/Massage Reservation API - Functional Test.postman_collection.json" \
          --reporters cli,cli-full,html \
          --reporter-cli-full-noSuccessAssertions=false \
          --reporter-html-export newman-report.html

      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: massage-api-newman-report
          path: newman-report.html
