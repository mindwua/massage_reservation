name: Run Newman Tests for Massage Reservation API

on:
  push:
    branches: [ main ]

jobs:
  run-newman-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Newman
        run: npm install -g newman

      - name: Install Newman HTML Reporter
        run: npm install -g newman-reporter-html

      # Start your backend (เลือกแนวทางที่ 2 หรือเปลี่ยน URL ใน collection ไปแนวทางที่ 1)
      - name: Start backend (Example with npm)
        run: |
          npm install
          npm run start &
        working-directory: backend  # ปรับ path ให้ตรง project

      - name: Wait for backend to be ready
        run: sleep 10

      - name: Run Newman Collection - Massage Reservation API
        run: |
          newman run "collections/Massage Reservation API - Functional Test.postman_collection.json" \
          --reporters cli,html \
          --reporter-html-export newman-report.html

      - name: Upload Newman HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: massage-api-newman-report
          path: newman-report.html
